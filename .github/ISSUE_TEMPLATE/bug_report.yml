name: 问题反馈
description: 报告连接、预览、参数或保存问题
title: '[问题] '
body:
  - type: input
    id: version
    attributes:
      label: 软件版本及 Windows 版本
      placeholder: Camera Desk v1.0.0 / Windows 11 64 位
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: 摄像头和连接方式
      description: 品牌型号、机位数量、USB 接口或采集卡。也请说明演示模式是否正常。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 请附相关截图和日志片段；先移除照片、私人路径等个人信息。
    validations:
      required: true

